name: Auto-Update Publications (Semantic Scholar)

on:
  schedule:
    # Runs every Sunday at 2am UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

jobs:
  fetch-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Semantic Scholar data for all faculty
        env:
          SS_API_KEY: ${{ secrets.SS_API_KEY }}
        run: python scripts/fetch_pubmed.py

      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Publications Auto-Updater"
          git add data/publications.json data/last_updated.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update publications $(date '+%Y-%m-%d')"
          git push
